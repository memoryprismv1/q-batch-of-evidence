name: Q-Batch tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out Q-Batch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Q-Batch logger, runners and tests
        run: python -m compileall -q testing_logger tests experiments
      - name: Run logger tests
        run: python -m unittest discover -s tests -v
      - name: Run CT logging and paired-runner tests
        run: python -m unittest experiments.ct_ab.test_logging experiments.ct_ab.test_pair_runner -v
      - name: Run checklist-elaboration runner tests
        run: python -m unittest experiments.checklist_elaboration.test_runner -v
      - name: Run Q-Batch order/carryover method tests
        run: python -m unittest experiments.ct_ab.test_method_demo -v
      - name: Run actor-attribution knowledge-transfer tests
        run: python -m unittest experiments.actor_attribution_transfer.test_runner -v
      - name: Run AI-generated team-learning harness tests (fake client only)
        run: python -m unittest experiments.ai_generated_team_learning.test_runner -v
      - name: Check out clean source snapshot for actor-attribution evidence
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: clean-actor-attribution-batch
      - name: Execute six-run actor-attribution transfer batch
        working-directory: clean-actor-attribution-batch
        run: PYTHONDONTWRITEBYTECODE=1 python -m experiments.actor_attribution_transfer.runner --output "$RUNNER_TEMP/actor-attribution-transfer-batch"
      - name: Preserve actor-attribution transfer evidence
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: actor-attribution-transfer-batch
          path: ${{ runner.temp }}/actor-attribution-transfer-batch/
          if-no-files-found: error
          retention-days: 30
      - name: Run historical evidence analysis tests
        run: python -m unittest discover -s experiments/qbatch_historical_analysis -p 'test_*.py' -v
      - name: Execute deterministic Q-Batch methodology demonstration
        run: python -m experiments.ct_ab.method_demo --output "$RUNNER_TEMP/ct-ab-method-demo"
      - name: Run synthetic pair preflight
        run: python -m experiments.ct_ab.preflight --output "$RUNNER_TEMP/ct-ab-preflight"
