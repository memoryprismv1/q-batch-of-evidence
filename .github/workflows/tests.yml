name: Q-Batch tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out Q-Batch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Q-Batch logger, runners and tests
        run: python -m compileall -q testing_logger tests experiments
      - name: Run logger tests
        run: python -m unittest discover -s tests -v
      - name: Run CT logging and paired-runner tests
        run: python -m unittest experiments.ct_ab.test_logging experiments.ct_ab.test_pair_runner -v
      - name: Run checklist-elaboration runner tests
        run: python -m unittest experiments.checklist_elaboration.test_runner -v
      - name: Run Q-Batch order/carryover method tests
        run: python -m unittest experiments.ct_ab.test_method_demo -v
      - name: Run historical evidence analysis tests
        run: python -m unittest discover -s experiments/qbatch_historical_analysis -p 'test_*.py' -v
      - name: Execute deterministic Q-Batch methodology demonstration
        run: python -m experiments.ct_ab.method_demo --output "$RUNNER_TEMP/ct-ab-method-demo"
      - name: Run synthetic pair preflight
        run: python -m experiments.ct_ab.preflight --output "$RUNNER_TEMP/ct-ab-preflight"
